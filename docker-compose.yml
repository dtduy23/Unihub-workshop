version: '3.8'

# ==============================================================================
# UNIHUB WORKSHOP — LOCALHOST DEMO (16 CPUs SYSTEM)
# Phân bổ 1 CPU cho mỗi replica/container:
# - Infra: Postgres (1 CPU), Redis (1 CPU), RabbitMQ (1 CPU), MailHog (1 CPU) = 4 CPUs
# - Backend API: 8 replicas (1 CPU/replica) = 8 CPUs
# - Backend Worker: 2 replicas (1 CPU/replica) = 2 CPUs
# - Frontend Web: 2 replicas (1 CPU/replica) = 2 CPUs
# Tổng cộng: 16 Container Replicas = 16 CPUs
# ==============================================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: unihub-postgres
    command: postgres -c max_connections=300
    environment:
      POSTGRES_USER: unihub
      POSTGRES_PASSWORD: unihub_secret
      POSTGRES_DB: unihub_workshop
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/backend/internal/database/migrations/001_init_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./src/backend/internal/database/migrations/002_seed_data.sql:/docker-entrypoint-initdb.d/02_seed.sql
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '1.0'
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unihub -d unihub_workshop"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: unihub-redis
    ports:
      - "6379:6379"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '1.0'
          memory: 256M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: unihub-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '1.0'
          memory: 512M
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 5

  mailhog:
    image: mailhog/mailhog:latest
    container_name: unihub-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 256M
        reservations:
          cpus: '1.0'
          memory: 128M

  api:
    build:
      context: ./src/backend
      dockerfile: Dockerfile
    image: unihub-backend:localhost
    environment:
      APP_MODE: "api"
      DB_HOST: "postgres"
      DB_PORT: "5432"
      DB_USER: "unihub"
      DB_PASSWORD: "unihub_secret"
      DB_NAME: "unihub_workshop"
      DB_SSLMODE: "disable"
      REDIS_ADDR: "redis:6379"
      RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672/"
      SMTP_HOST: "mailhog"
      SMTP_PORT: "1025"
      SERVER_PORT: "8080"
      CORS_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    deploy:
      replicas: 8
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '1.0'
          memory: 256M

  worker:
    build:
      context: ./src/backend
      dockerfile: Dockerfile
    image: unihub-backend:localhost
    environment:
      APP_MODE: "worker"
      DB_HOST: "postgres"
      DB_PORT: "5432"
      DB_USER: "unihub"
      DB_PASSWORD: "unihub_secret"
      DB_NAME: "unihub_workshop"
      DB_SSLMODE: "disable"
      REDIS_ADDR: "redis:6379"
      RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672/"
      SMTP_HOST: "mailhog"
      SMTP_PORT: "1025"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '1.0'
          memory: 256M

  web:
    build:
      context: ./src/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: "http://localhost:8080"
    image: unihub-web:localhost
    depends_on:
      - api
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '1.0'
          memory: 256M

  gateway:
    image: nginx:alpine
    container_name: unihub-gateway
    ports:
      - "8080:8080"
      - "3000:3000"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    depends_on:
      - api
      - web


volumes:
  postgres_data:
