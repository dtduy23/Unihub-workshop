apiVersion: apps/v1
kind: Deployment
metadata:
  name: git-demo
  namespace: unihub-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: git-demo
  template:
    metadata:
      labels:
        app: git-demo
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 101
      containers:
      - name: git
        image: nginxinc/nginx-unprivileged:1.27-alpine
        ports:
        - name: http
          containerPort: 8080
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            cpu: 250m
            memory: 128Mi
        readinessProbe:
          httpGet:
            path: /repo.git/HEAD
            port: http
          periodSeconds: 3
        volumeMounts:
        - name: repository
          mountPath: /srv
        - name: config
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: default.conf
      volumes:
      - name: repository
        emptyDir: {}
      - name: config
        configMap:
          name: git-demo-config
---
apiVersion: v1
kind: Service
metadata:
  name: git-demo
  namespace: unihub-demo
spec:
  selector:
    app: git-demo
  ports:
  - name: http
    port: 8080
    targetPort: http
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: git-demo-config
  namespace: unihub-demo
data:
  default.conf: 'server { listen 8080; server_name _; root /srv; location / { autoindex
    on; } }

    '
