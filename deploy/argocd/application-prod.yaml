apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: unihub-prod
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '10'
spec:
  project: unihub
  source:
    repoURL: https://github.com/dtduy23/Unihub-workshop.git
    targetRevision: main
    path: deploy/helm/unihub
    helm:
      releaseName: unihub
      valueFiles:
      - values-prod.yaml
      - images-prod.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: unihub-prod
  syncPolicy:
    syncOptions:
    - CreateNamespace=true
    - RespectIgnoreDifferences=true
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  ignoreDifferences:
  - group: apps
    kind: Deployment
    name: unihub-api
    jsonPointers:
    - /spec/replicas
  - group: apps
    kind: Deployment
    name: unihub-worker
    jsonPointers:
    - /spec/replicas
