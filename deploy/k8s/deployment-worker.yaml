# ============================================
# DEPLOYMENT — Background Worker
# ============================================
# APP_MODE=worker: chỉ chạy background jobs, không chạy HTTP server
# Cố định 1 replica để tránh race condition (cleanup, batch import)

apiVersion: apps/v1
kind: Deployment
metadata:
  name: unihub-worker
  namespace: unihub
  labels:
    app.kubernetes.io/name: unihub
    app.kubernetes.io/component: worker
spec:
  replicas: 2  # Demo localhost: 2 worker replicas (1 CPU each)
  selector:
    matchLabels:
      app: unihub-worker
  template:
    metadata:
      labels:
        app: unihub-worker
        app.kubernetes.io/name: unihub
        app.kubernetes.io/component: worker
    spec:
      serviceAccountName: unihub-worker
      containers:
      - name: worker
        image: asia-southeast1-docker.pkg.dev/test-projectproject/unihub-docker/unihub-backend:latest
        imagePullPolicy: Always

        env:
        - name: APP_MODE
          value: "worker"

        envFrom:
        - configMapRef:
            name: unihub-config
        - secretRef:
            name: unihub-secret

        resources:
          requests:
            cpu: "1"        # 1 CPU per pod (Demo localhost 16 CPUs)
            memory: "256Mi"
          limits:
            cpu: "1"        # 1 CPU per pod
            memory: "512Mi"
