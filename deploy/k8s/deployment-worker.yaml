# ============================================
# DEPLOYMENT — Background Worker
# ============================================
# APP_MODE=worker: chỉ chạy background jobs, không chạy HTTP server
# Cố định 1 replica để tránh race condition (cleanup, batch import)

apiVersion: apps/v1
kind: Deployment
metadata:
  name: unihub-worker
  namespace: unihub
  labels:
    app.kubernetes.io/name: unihub
    app.kubernetes.io/component: worker
spec:
  replicas: 1  # Adjusted for local Minikube demo
  selector:
    matchLabels:
      app: unihub-worker
  template:
    metadata:
      labels:
        app: unihub-worker
        app.kubernetes.io/name: unihub
        app.kubernetes.io/component: worker
    spec:
      serviceAccountName: unihub-worker
      containers:
      - name: worker
        image: unihub-backend:localhost
        imagePullPolicy: IfNotPresent

        env:
        - name: APP_MODE
          value: "worker"

        envFrom:
        - configMapRef:
            name: unihub-config
        - secretRef:
            name: unihub-secret

        resources:
          requests:
            cpu: "100m"     # 0.1 CPU per pod
            memory: "128Mi"
          limits:
            cpu: "500m"     # 0.5 CPU limit per pod
            memory: "512Mi"
