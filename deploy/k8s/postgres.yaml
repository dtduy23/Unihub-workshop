apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: unihub
  labels:
    app: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_DB
          value: "unihub_workshop"
        - name: POSTGRES_USER
          value: "unihub"
        - name: POSTGRES_PASSWORD
          value: "unihub_pass"
        resources:
          limits:
            memory: 512Mi
          requests:
            memory: 256Mi
        readinessProbe:
          exec:
            command: ["pg_isready", "-U", "unihub", "-d", "unihub_workshop"]
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: unihub
spec:
  selector:
    app: postgres
  ports:
  - port: 5432
    targetPort: 5432
