# ============================================
# DEPLOYMENT — Backend API Server
# ============================================
# APP_MODE=api: chỉ chạy HTTP server, không chạy background workers
# HPA sẽ scale từ 2 đến 20 replicas dựa trên CPU

apiVersion: apps/v1
kind: Deployment
metadata:
  name: unihub-api
  namespace: unihub
  labels:
    app.kubernetes.io/name: unihub
    app.kubernetes.io/component: api
spec:
  replicas: 12  # Localhost 16 CPUs demo: 12 API replicas + 2 Web + 2 Worker = 16 CPUs (1 CPU/replica)
  selector:
    matchLabels:
      app: unihub-api
  template:
    metadata:
      labels:
        app: unihub-api
        app.kubernetes.io/name: unihub
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: unihub-api
      containers:
      - name: api
        image: asia-southeast1-docker.pkg.dev/test-projectproject/unihub-docker/unihub-backend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          protocol: TCP

        env:
        - name: APP_MODE
          value: "api"

        envFrom:
        - configMapRef:
            name: unihub-config
        - secretRef:
            name: unihub-secret

        # Readiness: K8s chỉ gửi traffic khi app sẵn sàng
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3

        # Liveness: K8s tự restart nếu app bị treo
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 3

        resources:
          requests:
            cpu: "1"        # 1 CPU per pod (Demo localhost 16 CPUs)
            memory: "512Mi"
          limits:
            cpu: "1"        # 1 CPU per pod
            memory: "1Gi"

      # Ưu tiên phân bổ đều, nhưng không block nếu thiếu node
      topologySpreadConstraints:
      - maxSkew: 3
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: unihub-api
