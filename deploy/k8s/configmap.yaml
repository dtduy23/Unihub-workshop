# ============================================
# CONFIGMAP — Biến môi trường không nhạy cảm
# ============================================
# Giá trị lấy từ: terraform output
# Chạy: terraform output cloudsql_private_ip / redis_addr

apiVersion: v1
kind: ConfigMap
metadata:
  name: unihub-config
  namespace: unihub
  labels:
    app.kubernetes.io/name: unihub
data:
  # --- Database ---
  DB_HOST: "localhost"  # Localhost demo: postgres on 5433 or k8s postgres
  DB_PORT: "5432"
  DB_NAME: "unihub_workshop"
  DB_USER: "unihub"
  DB_SSLMODE: "disable"

  # --- Redis ---
  REDIS_ADDR: "localhost:6379"  # Localhost demo
  REDIS_PASSWORD: ""

  # --- Server ---
  SERVER_PORT: "8080"
  CORS_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000"

  # --- SMTP ---
  SMTP_HOST: "localhost"
  SMTP_PORT: "1025"
  SMTP_FROM: "noreply@unihub.edu.vn"

  # --- AI ---
  GEMINI_MODEL: "gemini-1.5-flash"
  AI_TEMPERATURE: "0.4"
  AI_MAX_TOKENS: "16384"

  # --- Batch Import ---
  CSV_IMPORT_DIR: "./data/imports"
  CSV_ARCHIVE_DIR: "./data/archive"

  # --- Rate Limiting ---
  RATE_LIMIT_CAPACITY: "5000"
  RATE_LIMIT_REFILL_RATE: "1000"
  RATE_LIMIT_TTL: "300"

  # --- Migration ---
  RUN_SEED: "true"

  # --- Payment ---
  PAYMENT_GATEWAY_URL: "http://localhost:8080/mock/payment"

---

# ConfigMap riêng cho Frontend
apiVersion: v1
kind: ConfigMap
metadata:
  name: unihub-web-config
  namespace: unihub
  labels:
    app.kubernetes.io/name: unihub
    app.kubernetes.io/component: web
data:
  NEXT_PUBLIC_API_URL: "http://localhost:8080"
