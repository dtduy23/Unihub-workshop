# --- In-Cluster Infrastructure (Dev/Local minikube only) ---
postgres:
  enabled: true
  image:
    repository: postgres
    tag: "16-alpine"
    pullPolicy: IfNotPresent
  database: "unihub_workshop"
  user: "unihub"
  password: "unihub_pass"
  port: 5432
  resources:
    requests:
      memory: "256Mi"
    limits:
      memory: "512Mi"

redis:
  enabled: true
  image:
    repository: redis
    tag: "7-alpine"
    pullPolicy: IfNotPresent
  port: 6379
  resources:
    requests:
      memory: "64Mi"
    limits:
      memory: "256Mi"

rabbitmq:
  enabled: true
  image:
    repository: rabbitmq
    tag: "3-management-alpine"
    pullPolicy: IfNotPresent
  user: "unihub"
  password: "unihub-rmq-pass"
  ports:
    amqp: 5672
    management: 15672
  storage: 8Gi
  resources:
    requests:
      cpu: "250m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
