global:
  environment: development
nameOverride: ''
fullnameOverride: ''
imagePullSecrets: []
secrets:
  create: false
  existingSecret: unihub-secret
  dbPassword: ''
  authSecret: ''
  rsaPrivateKey: ''
  rabbitmqPassword: ''
  rabbitmqUrl: ''
  redisPassword: ''
  geminiApiKey: ''
  smtpUser: ''
  smtpPass: ''
api:
  enabled: true
  replicaCount: 1
  image:
    repository: duyd4010/unihub-backend
    tag: v1.0.0
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
    targetPort: 8080
    nodePort: 30080
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 1000m
      memory: 512Mi
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 16
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
    presence:
      enabled: false
      metricName: unihub_active_online_users
      targetActiveUsersPerPod: 150
    keda:
      enabled: false
      prometheusServer: http://monitoring-kube-prometheus-prometheus.monitoring.svc:9090
    scaleUp:
      stabilizationWindowSeconds: 0
      selectPolicy: Max
      policies:
      - type: Percent
        value: 100
        periodSeconds: 15
    scaleDown:
      stabilizationWindowSeconds: 300
      selectPolicy: Min
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
  serviceAccount:
    create: true
    name: unihub-api
    annotations: {}
  topologySpreadConstraints:
    enabled: true
    maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway
worker:
  enabled: true
  replicaCount: 1
  image:
    repository: duyd4010/unihub-backend
    tag: v1.0.0
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 1000m
      memory: 512Mi
  serviceAccount:
    create: true
    name: unihub-worker
    annotations: {}
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 20
    queueLength: 50
    pollingInterval: 15
    cooldownPeriod: 300
web:
  enabled: true
  replicaCount: 1
  image:
    repository: duyd4010/unihub-web
    tag: v1.0.0
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
    targetPort: 3000
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 1000m
      memory: 512Mi
  env:
    API_INTERNAL_URL: http://unihub-api-service
media:
  enabled: true
  existingClaim: ''
  storageClass: ''
  accessModes:
  - ReadWriteOnce
  size: 5Gi
migrations:
  enabled: true
  activeDeadlineSeconds: 300
  backoffLimit: 3
podMonitor:
  enabled: false
  interval: 15s
  path: /metrics
  labels:
    release: monitoring
ingress:
  enabled: false
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 50m
  hosts:
  - host: unihub.local
    paths:
    - path: /api/v1
      pathType: Prefix
      serviceName: unihub-api-service
      servicePort: 80
    - path: /
      pathType: Prefix
      serviceName: unihub-web-service
      servicePort: 80
  tls: []
config:
  dbHost: postgres
  dbPort: '5432'
  dbName: unihub_workshop
  dbUser: unihub
  dbSslMode: disable
  dbMaxConns: '10'
  dbMinConns: '2'
  redisAddr: redis:6379
  redisDb: '0'
  serverPort: '8080'
  corsOrigins: http://localhost:3000,http://127.0.0.1:3000
  webUrl: http://localhost:3000
  mediaDir: /app/data/media
  smtpHost: mailhog
  smtpPort: '1025'
  smtpFrom: noreply@unihub.edu.vn
  geminiModel: gemini-1.5-flash
  aiTemperature: '0.4'
  aiMaxTokens: '16384'
  csvImportDir: /app/data/imports
  csvArchiveDir: /app/data/archive
  rateLimitCapacity: '5000'
  rateLimitRefillRate: '1000'
  rateLimitTTL: '300'
  runSeed: 'false'
postgres:
  enabled: true
  image:
    repository: postgres
    tag: 16-alpine
    pullPolicy: IfNotPresent
  storage: 8Gi
  storageClass: ''
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 512Mi
redis:
  enabled: true
  image:
    repository: redis
    tag: 7-alpine
    pullPolicy: IfNotPresent
  storage: 1Gi
  storageClass: ''
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
rabbitmq:
  enabled: true
  image:
    repository: rabbitmq
    tag: 3.13-management-alpine
    pullPolicy: IfNotPresent
  user: unihub
  storage: 8Gi
  storageClass: ''
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 768Mi
mailpit:
  enabled: true
  image: axllent/mailpit:v1.24.0
