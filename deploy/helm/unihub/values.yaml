# ==============================================================================
# UniHub Platform — Helm Default Values (Development / Local Minikube)
# ==============================================================================

global:
  environment: development

nameOverride: ""
fullnameOverride: ""

# --- Backend API Service ---
api:
  enabled: true
  replicaCount: 2
  image:
    repository: duyd4010/unihub-backend
    tag: "latest"
    pullPolicy: IfNotPresent
  service:
    type: NodePort
    port: 80
    targetPort: 8080
    nodePort: 30080
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 16
    targetCPUUtilizationPercentage: 70
    presence:
      enabled: true
      metricName: "unihub_active_online_users"
      targetActiveUsersPerPod: 150
    scaleUp:
      stabilizationWindowSeconds: 0
      selectPolicy: Max
      policies:
        - type: Pods
          value: 16
          periodSeconds: 15
        - type: Percent
          value: 1000
          periodSeconds: 15
    scaleDown:
      stabilizationWindowSeconds: 300
      selectPolicy: Min
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
  serviceAccount:
    create: true
    name: "unihub-api"
    annotations: {}
  probes:
    readiness:
      path: /health
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3
    liveness:
      path: /health
      initialDelaySeconds: 15
      periodSeconds: 20
      timeoutSeconds: 5
      failureThreshold: 3
  topologySpreadConstraints:
    enabled: true
    maxSkew: 3
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway

# --- Background Worker Service ---
worker:
  enabled: true
  replicaCount: 1
  image:
    repository: duyd4010/unihub-backend
    tag: "latest"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
  serviceAccount:
    create: true
    name: "unihub-worker"
    annotations: {}

# --- Frontend Web (Next.js) ---
web:
  enabled: true
  replicaCount: 1
  image:
    repository: duyd4010/unihub-web
    tag: "latest"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
    targetPort: 3000
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
  probes:
    readiness:
      path: /login
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 3
    liveness:
      path: /login
      initialDelaySeconds: 10
      periodSeconds: 30
      timeoutSeconds: 5
  env:
    NEXT_PUBLIC_API_URL: "http://unihub-api-service"

# --- Ingress ---
ingress:
  enabled: false
  className: "nginx"
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/load-balance: "ewma"
    # nginx.ingress.kubernetes.io/limit-rps: "100"
    # cert-manager.io/cluster-issuer: "letsencrypt-prod"
  hosts:
    - host: ""
      paths:
        - path: /api
          pathType: Prefix
          serviceName: unihub-api-service
          servicePort: 80
        - path: /health
          pathType: Exact
          serviceName: unihub-api-service
          servicePort: 80
        - path: /
          pathType: Prefix
          serviceName: unihub-web-service
          servicePort: 80
  tls: []

# --- PodMonitoring (Prometheus Operator - optional, annotations used by default) ---
podMonitor:
  enabled: false
  interval: 15s
  path: /metrics

# --- Application Configuration (ConfigMap) ---
config:
  dbHost: "postgres"
  dbPort: "5432"
  dbName: "unihub_workshop"
  dbUser: "unihub"
  dbSslMode: "disable"
  redisAddr: "redis:6379"
  redisPassword: ""
  redisDb: "0"
  rabbitmqUrl: "amqp://unihub:unihub-rmq-pass@rabbitmq:5672/"
  serverPort: "8080"
  corsOrigins: "http://localhost:3000,http://127.0.0.1:3000"
  smtpHost: "mailhog"
  smtpPort: "1025"
  smtpFrom: "noreply@unihub.edu.vn"
  geminiModel: "gemini-1.5-flash"
  aiTemperature: "0.4"
  aiMaxTokens: "16384"
  csvImportDir: "./data/imports"
  csvArchiveDir: "./data/archive"
  rateLimitCapacity: "5000"
  rateLimitRefillRate: "1000"
  rateLimitTTL: "300"
  runSeed: "true"
  paymentGatewayUrl: "http://unihub-api-service/mock/payment"

