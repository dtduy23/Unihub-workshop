{{- if .Values.postgres.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  annotations: {argocd.argoproj.io/sync-wave: "1"}
  labels:
    {{- include "unihub.labels" . | nindent 4 }}
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: {app: postgres, app.kubernetes.io/instance: {{ .Release.Name }}}
  template:
    metadata:
      labels: {app: postgres, app.kubernetes.io/instance: {{ .Release.Name }}}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: postgres
          image: "{{ .Values.postgres.image.repository }}:{{ .Values.postgres.image.tag }}"
          imagePullPolicy: {{ .Values.postgres.image.pullPolicy }}
          ports: [{name: tcp, containerPort: 5432}]
          args: ["-c", "max_connections=300"]
          env:
            - {name: POSTGRES_DB, value: {{ .Values.config.dbName | quote }}}
            - {name: POSTGRES_USER, value: {{ .Values.config.dbUser | quote }}}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: {{ include "unihub.secretName" . }}, key: DB_PASSWORD}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          readinessProbe:
            exec: {command: [sh, -ec, 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']}
            periodSeconds: 5
          livenessProbe:
            exec: {command: [sh, -ec, 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']}
            initialDelaySeconds: 30
            periodSeconds: 20
          resources: {{ toYaml .Values.postgres.resources | nindent 12 }}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels: {app.kubernetes.io/instance: {{ .Release.Name }}}
      spec:
        accessModes: [ReadWriteOnce]
        {{- if .Values.postgres.storageClass }}
        storageClassName: {{ .Values.postgres.storageClass | quote }}
        {{- end }}
        resources:
          requests: {storage: {{ .Values.postgres.storage }}}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  annotations: {argocd.argoproj.io/sync-wave: "1"}
spec:
  selector: {app: postgres, app.kubernetes.io/instance: {{ .Release.Name }}}
  ports: [{name: tcp, port: 5432, targetPort: tcp}]
{{- end }}
