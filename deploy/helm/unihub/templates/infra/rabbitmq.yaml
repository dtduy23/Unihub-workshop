{{- if .Values.rabbitmq.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
  annotations: {argocd.argoproj.io/sync-wave: "1"}
  labels:
    {{- include "unihub.labels" . | nindent 4 }}
spec:
  serviceName: rabbitmq
  replicas: 1
  selector:
    matchLabels: {app: rabbitmq, app.kubernetes.io/instance: {{ .Release.Name }}}
  template:
    metadata:
      labels: {app: rabbitmq, app.kubernetes.io/instance: {{ .Release.Name }}}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: rabbitmq
          image: "{{ .Values.rabbitmq.image.repository }}:{{ .Values.rabbitmq.image.tag }}"
          imagePullPolicy: {{ .Values.rabbitmq.image.pullPolicy }}
          ports: [{name: amqp, containerPort: 5672}, {name: management, containerPort: 15672}, {name: metrics, containerPort: 15692}]
          env:
            - {name: RABBITMQ_DEFAULT_USER, value: {{ .Values.rabbitmq.user | quote }}}
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef: {name: {{ include "unihub.secretName" . }}, key: RABBITMQ_PASSWORD}
          startupProbe:
            exec: {command: [rabbitmq-diagnostics, -q, ping]}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec: {command: [rabbitmq-diagnostics, -q, check_running]}
            periodSeconds: 10
          livenessProbe:
            exec: {command: [rabbitmq-diagnostics, -q, ping]}
            periodSeconds: 30
          resources: {{ toYaml .Values.rabbitmq.resources | nindent 12 }}
          volumeMounts:
            - {name: data, mountPath: /var/lib/rabbitmq}
            - {name: plugins, mountPath: /etc/rabbitmq/enabled_plugins, subPath: enabled_plugins}
      volumes:
        - name: plugins
          configMap: {name: rabbitmq-plugins}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels: {app.kubernetes.io/instance: {{ .Release.Name }}}
      spec:
        accessModes: [ReadWriteOnce]
        {{- if .Values.rabbitmq.storageClass }}
        storageClassName: {{ .Values.rabbitmq.storageClass | quote }}
        {{- end }}
        resources:
          requests: {storage: {{ .Values.rabbitmq.storage }}}
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  annotations: {argocd.argoproj.io/sync-wave: "1"}
spec:
  selector: {app: rabbitmq, app.kubernetes.io/instance: {{ .Release.Name }}}
  ports: [{name: amqp, port: 5672, targetPort: amqp}, {name: management, port: 15672, targetPort: management}, {name: metrics, port: 15692, targetPort: metrics}]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: rabbitmq-plugins
  annotations: {argocd.argoproj.io/sync-wave: "0"}
data:
  enabled_plugins: "[rabbitmq_management,rabbitmq_prometheus]."
{{- if .Values.podMonitor.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: rabbitmq-metrics
  annotations: {argocd.argoproj.io/sync-wave: "4"}
  labels: {{ toYaml .Values.podMonitor.labels | nindent 4 }}
spec:
  selector:
    matchLabels: {app: rabbitmq, app.kubernetes.io/instance: {{ .Release.Name }}}
  podMetricsEndpoints: [{port: metrics, path: /metrics/per-object, interval: {{ .Values.podMonitor.interval }}}]
{{- end }}
{{- end }}
