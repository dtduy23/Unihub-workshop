{{- if and .Values.media.enabled (not .Values.media.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: unihub-media
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    helm.sh/resource-policy: keep
spec:
  accessModes: {{ toYaml .Values.media.accessModes | nindent 4 }}
  {{- if .Values.media.storageClass }}
  storageClassName: {{ .Values.media.storageClass | quote }}
  {{- end }}
  resources:
    requests: {storage: {{ .Values.media.size }}}
{{- end }}
