{{- if and .Values.worker.enabled .Values.worker.autoscaling.enabled }}
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: unihub-rabbitmq-auth
  annotations: {argocd.argoproj.io/sync-wave: "4"}
spec:
  secretTargetRef:
    - {parameter: host, name: {{ include "unihub.secretName" . }}, key: RABBITMQ_URL}
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: unihub-worker-queue
  annotations: {argocd.argoproj.io/sync-wave: "4"}
spec:
  scaleTargetRef: {name: unihub-worker}
  minReplicaCount: {{ .Values.worker.autoscaling.minReplicas }}
  maxReplicaCount: {{ .Values.worker.autoscaling.maxReplicas }}
  pollingInterval: {{ .Values.worker.autoscaling.pollingInterval }}
  cooldownPeriod: {{ .Values.worker.autoscaling.cooldownPeriod }}
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 300
  triggers:
    {{- range $queue := list "registration_queue" "notification_queue" }}
    - type: rabbitmq
      metadata:
        protocol: amqp
        queueName: {{ $queue }}
        mode: QueueLength
        value: {{ $.Values.worker.autoscaling.queueLength | quote }}
      authenticationRef: {name: unihub-rabbitmq-auth}
    {{- end }}
{{- end }}
