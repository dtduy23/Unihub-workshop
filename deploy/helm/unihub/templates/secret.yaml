{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "unihub.secretName" . }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    {{- include "unihub.labels" . | nindent 4 }}
type: Opaque
stringData:
  DB_PASSWORD: {{ required "secrets.dbPassword is required when secrets.create=true" .Values.secrets.dbPassword | quote }}
  AUTH_SECRET: {{ required "secrets.authSecret is required when secrets.create=true" .Values.secrets.authSecret | quote }}
  RSA_PRIVATE_KEY: {{ required "secrets.rsaPrivateKey is required when secrets.create=true" .Values.secrets.rsaPrivateKey | quote }}
  RABBITMQ_PASSWORD: {{ required "secrets.rabbitmqPassword is required" .Values.secrets.rabbitmqPassword | quote }}
  RABBITMQ_URL: {{ required "secrets.rabbitmqUrl is required" .Values.secrets.rabbitmqUrl | quote }}
  REDIS_PASSWORD: {{ .Values.secrets.redisPassword | quote }}
  GEMINI_API_KEY: {{ .Values.secrets.geminiApiKey | quote }}
  SMTP_USER: {{ .Values.secrets.smtpUser | quote }}
  SMTP_PASS: {{ .Values.secrets.smtpPass | quote }}
{{- end }}
