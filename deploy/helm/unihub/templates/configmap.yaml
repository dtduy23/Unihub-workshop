apiVersion: v1
kind: ConfigMap
metadata:
  name: unihub-config
  labels:
    {{- include "unihub.labels" . | nindent 4 }}
data:
  DB_HOST: {{ .Values.config.dbHost | quote }}
  DB_PORT: {{ .Values.config.dbPort | quote }}
  DB_NAME: {{ .Values.config.dbName | quote }}
  DB_USER: {{ .Values.config.dbUser | quote }}
  DB_SSLMODE: {{ .Values.config.dbSslMode | quote }}

  REDIS_ADDR: {{ .Values.config.redisAddr | quote }}
  REDIS_PASSWORD: {{ .Values.config.redisPassword | quote }}
  REDIS_DB: {{ .Values.config.redisDb | default "0" | quote }}

  RABBITMQ_URL: {{ .Values.config.rabbitmqUrl | quote }}

  SERVER_PORT: {{ .Values.config.serverPort | quote }}
  CORS_ORIGINS: {{ .Values.config.corsOrigins | quote }}

  SMTP_HOST: {{ .Values.config.smtpHost | quote }}
  SMTP_PORT: {{ .Values.config.smtpPort | quote }}
  SMTP_FROM: {{ .Values.config.smtpFrom | quote }}

  GEMINI_MODEL: {{ .Values.config.geminiModel | quote }}
  AI_TEMPERATURE: {{ .Values.config.aiTemperature | quote }}
  AI_MAX_TOKENS: {{ .Values.config.aiMaxTokens | quote }}

  CSV_IMPORT_DIR: {{ .Values.config.csvImportDir | quote }}
  CSV_ARCHIVE_DIR: {{ .Values.config.csvArchiveDir | quote }}

  RATE_LIMIT_CAPACITY: {{ .Values.config.rateLimitCapacity | quote }}
  RATE_LIMIT_REFILL_RATE: {{ .Values.config.rateLimitRefillRate | quote }}
  RATE_LIMIT_TTL: {{ .Values.config.rateLimitTTL | quote }}

  RUN_SEED: {{ .Values.config.runSeed | quote }}
  PAYMENT_GATEWAY_URL: {{ .Values.config.paymentGatewayUrl | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: unihub-web-config
  labels:
    {{- include "unihub.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
data:
  NEXT_PUBLIC_API_URL: {{ .Values.web.env.NEXT_PUBLIC_API_URL | quote }}
