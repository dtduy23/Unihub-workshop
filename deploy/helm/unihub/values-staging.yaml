global:
  environment: staging
api:
  replicaCount: 2
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
worker:
  replicaCount: 2
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 20
media:
  accessModes:
  - ReadWriteMany
podMonitor:
  enabled: true
config:
  runSeed: 'false'
  webUrl: https://staging.unihub.dev
  corsOrigins: https://staging.unihub.dev
ingress:
  enabled: true
  hosts:
  - host: staging.unihub.dev
    paths:
    - path: /api/v1
      pathType: Prefix
      serviceName: unihub-api-service
      servicePort: 80
    - path: /
      pathType: Prefix
      serviceName: unihub-web-service
      servicePort: 80
  tls:
  - secretName: unihub-staging-tls
    hosts:
    - staging.unihub.dev
