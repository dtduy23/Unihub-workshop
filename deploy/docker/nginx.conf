# ==============================================================================
# UNIHUB WORKSHOP — HIGH-CONCURRENCY NGINX LOAD BALANCER & REVERSE PROXY
# ==============================================================================

worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 65535;
    multi_accept on;
    use epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # --- DNS Resolver for Docker Service Discovery ---
    # 127.0.0.11 is Docker's internal embedded DNS server
    resolver 127.0.0.11 valid=5s ipv6=off;

    # --- Structured JSON Logging with Upstream & Latency Metrics ---
    log_format unihub_json escape=json
        '{"time":"$time_iso8601",'
        '"client_ip":"$remote_addr",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"status":$status,'
        '"bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_addr":"$upstream_addr",'
        '"upstream_response_time":"$upstream_response_time",'
        '"upstream_status":"$upstream_status",'
        '"user_agent":"$http_user_agent"}';

    access_log /var/log/nginx/access.log unihub_json;
    error_log  /var/log/nginx/error.log warn;

    # --- TCP & Core Performance Tuning ---
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    server_tokens   off; # Security: Hide Nginx version number

    keepalive_timeout  65;
    keepalive_requests 10000;
    client_max_body_size 50M;
    client_body_buffer_size 128k;

    # --- Gzip Compression ---
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # --- Security Headers ---
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # --- Rate Limiting & Anti-DDoS Zones ---
    # 10MB zone tracks ~160,000 distinct IP addresses
    limit_req_zone $binary_remote_addr zone=api_general_limit:10m rate=100r/s;
    limit_req_zone $binary_remote_addr zone=api_register_limit:10m rate=20r/s;
    limit_conn_zone $binary_remote_addr zone=addr_conn_limit:10m;

    limit_req_status  429;
    limit_conn_status 429;

    # ==========================================================================
    # UPSTREAMS (LOAD BALANCING & CONNECTION POOLING)
    # ==========================================================================

    # Backend API: 8 Replicas
    # least_conn routes incoming traffic to the backend replica with the fewest active connections
    upstream backend_api {
        least_conn;
        server api:8080 max_fails=3 fail_timeout=10s;
        keepalive 256; # Persistent TCP connection pool to Go backend
    }

    # Frontend Web: 2 Replicas
    upstream frontend_web {
        least_conn;
        server web:3000 max_fails=3 fail_timeout=10s;
        keepalive 64;
    }

    # ==========================================================================
    # SERVER 1: UNIFIED ENTRYPOINT GATEWAY (PORT 80)
    # Routes /api to Backend API and / to Next.js Web Frontend
    # ==========================================================================
    server {
        listen 80;
        server_name localhost;

        # Gateway health check
        location /healthz {
            access_log off;
            return 200 '{"status":"ok","gateway":"nginx"}\n';
            add_header Content-Type application/json;
        }

        # Nginx status for Prometheus monitoring
        location /stub_status {
            stub_status;
            access_log off;
            allow 127.0.0.1;
            allow 172.16.0.0/12;
            deny all;
        }

        # Critical: Workshop registration endpoint (Flash crowd burst limit)
        location ~* ^/api/v1/registrations {
            limit_req zone=api_register_limit burst=30 nodelay;
            limit_conn addr_conn_limit 30;

            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
            proxy_buffering on;
            proxy_buffer_size 16k;
            proxy_buffers 8 32k;
        }

        # General Backend API
        location /api/ {
            limit_req zone=api_general_limit burst=50 nodelay;
            limit_conn addr_conn_limit 50;

            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            proxy_buffering on;
            proxy_buffer_size 16k;
            proxy_buffers 8 32k;
        }

        # Health & Metrics pass-through
        location ~ ^/(health|metrics) {
            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Frontend Next.js Web App
        location / {
            limit_conn addr_conn_limit 50;

            proxy_pass http://frontend_web;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support for Next.js HMR & real-time communication
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
    }

    # ==========================================================================
    # SERVER 2: DEDICATED API GATEWAY (PORT 8080)
    # Direct access to Backend API replicas (Round-robin / least_conn)
    # ==========================================================================
    server {
        listen 8080;
        server_name localhost;

        location / {
            limit_req zone=api_general_limit burst=50 nodelay;
            limit_conn addr_conn_limit 50;

            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            proxy_buffering on;
            proxy_buffer_size 16k;
            proxy_buffers 8 32k;
        }
    }

    # ==========================================================================
    # SERVER 3: DEDICATED WEB GATEWAY (PORT 3000)
    # Direct access to Frontend Web replicas
    # ==========================================================================
    server {
        listen 3000;
        server_name localhost;

        location / {
            proxy_pass http://frontend_web;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
    }
}
