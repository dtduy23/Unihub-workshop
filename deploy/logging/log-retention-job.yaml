apiVersion: batch/v1
kind: Job
metadata:
  name: unihub-log-setup
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 300
  template:
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      containers:
      - name: setup
        image: curlimages/curl:8.12.1
        command:
        - sh
        - -ec
        - 'set -eu

          curl -fsS http://opensearch:9200/_plugins/_ism/policies/unihub-logs >/dev/null
          || curl --fail-with-body --retry 12 --retry-delay 5 -X PUT http://opensearch:9200/_plugins/_ism/policies/unihub-logs
          -H ''Content-Type: application/json'' -d ''{"policy":{"description":"Delete
          demo logs after seven days","default_state":"hot","states":[{"name":"hot","actions":[],"transitions":[{"state_name":"delete","conditions":{"min_index_age":"7d"}}]},{"name":"delete","actions":[{"delete":{}}],"transitions":[]}],"ism_template":[{"index_patterns":["logs-unihub-*"],"priority":100}]}}''

          curl --fail-with-body --retry 12 --retry-delay 5 -X POST http://opensearch-dashboards:5601/api/saved_objects/index-pattern/unihub-logs?overwrite=true
          -H ''osd-xsrf: true'' -H ''Content-Type: application/json'' -d ''{"attributes":{"title":"logs-unihub-*","timeFieldName":"@timestamp"}}''

          '
