apiVersion: apps/v1
kind: Deployment
metadata:
  name: opensearch-dashboards
  annotations:
    argocd.argoproj.io/sync-wave: '2'
spec:
  replicas: 1
  selector:
    matchLabels:
      app: opensearch-dashboards
  template:
    metadata:
      labels:
        app: opensearch-dashboards
    spec:
      automountServiceAccountToken: false
      containers:
      - name: dashboards
        image: opensearchproject/opensearch-dashboards:2.19.1
        env:
        - name: OPENSEARCH_HOSTS
          value: '["http://opensearch:9200"]'
        - name: DISABLE_SECURITY_DASHBOARDS_PLUGIN
          value: 'true'
        ports:
        - name: http
          containerPort: 5601
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 768Mi
        startupProbe:
          httpGet:
            path: /api/status
            port: http
          failureThreshold: 60
          periodSeconds: 5
        readinessProbe:
          httpGet:
            path: /api/status
            port: http
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: opensearch-dashboards
  annotations:
    argocd.argoproj.io/sync-wave: '2'
spec:
  selector:
    app: opensearch-dashboards
  ports:
  - port: 5601
    targetPort: http
